  .nb-fab::before{content:'';position:absolute;top:-10px;left:50%;transform:translateX(-50%) rotate(-4deg);width:50px;height:14px;background:rgba(244,195,60,.7);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  @keyframes nb-fade{from{opacity:0}to{opacity:1}}

  .nb-dots::after{content:'';animation:nb-blink 1.2s steps(3) infinite}
  @keyframes nb-blink{0%{content:''}33%{content:'.'}66%{content:'..'}100%{content:'...'}}
  ::-webkit-scrollbar{width:12px}
  ::-webkit-scrollbar-track{background:var(--paper)}
  ::-webkit-scrollbar-thumb{background:var(--pencil);border:3px solid var(--paper);border-radius:6px}

<script type="text/babel">

const StarBurst=({s=30,color=red,style={}})=>(<svg width={s} height={s} viewBox="0 0 30 30" style={{display:'block',overflow:'visible',...style}}><g stroke={color} strokeWidth="2" strokeLinecap="round" fill="none"><line x1="15" y1="3" x2="15" y2="27"/><line x1="3" y1="15" x2="27" y2="15"/><line x1="6" y1="6" x2="24" y2="24"/><line x1="24" y1="6" x2="6" y2="24"/></g></svg>);

const Strikethrough=({w=100,color=red,style={}})=>(<svg width={w} height="6" viewBox={`0 0 ${w} 6`} style={{display:'block',position:'absolute',left:0,top:'50%',transform:'translateY(-2px)',overflow:'visible',...style}}><path d={`M 2 3 Q ${w*.3} 1,${w*.5} 3 T ${w-2} 3`} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round"/></svg>);

window.Scribbles={Underline,DoubleUnderline,ScribbleCircle,ArrowCurved,ArrowWavy,StarBurst,Checkbox,Strikethrough,Bracket,TornEdge,Tape,StickyTag,Margin,Marker,COL:{ink,red,blue,pencil}};

e',fontSize:28,color:C3.ink,marginBottom:24,lineHeight:1.1}}>Vipul Yadav<br/><span style={{fontSize:18,color:C3.pencil}}>BTKIT '27 · Haridwar, IN</span></div><div style={{fontFamily:'"Patrick Hand",cursive',fontSize:16,color:C3.pencil,marginBottom:6}}>TO: ↓</div><div style={{fontFamily:'"Caveat",cursive',fontSize:24,color:C3.ink,lineHeight:1.2,padding:'0 0 10px'}}>(whoever's reading this)</div><div style={{borderTop:`1.5px dashed ${C3.pencil}80`,marginTop:8,paddingTop:16}}><ul style={{listStyle:'none',padding:0,margin:0}}>{window.ndata.contact.map((r,i,arr)=>(<li key={r.k} style={{display:'flex',justifyContent:'space-between',padding:'8px 0',borderBottom:i<arr.length-1?`1px dotted ${C3.pencil}50`:'none',fontFamily:'"Patrick Hand",cursive',fontSize:18}}><span style={{color:C3.pencil}}>{r.k}</span><a href={r.href} target="_blank" rel="noopener" style={{color:r.primary?C3.red:C3.ink,textDecoration:'none',borderBottom:`1.5px solid ${r.primary?C3.red:'transparent'}`}}>{r.v}</a></li>))}</ul></div></div><div style={{position:'absolute',bottom:-20,left:'50%',transform:'translateX(-50%) rotate(-12deg)',width:64,height:64,borderRadius:'50%',background:C3.red,color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'"Caveat",cursive',fontSize:18,lineHeight:1,textAlign:'center',boxShadow:'0 4px 10px rgba(200,48,48,.3)'}}>v.y.<br/>'26</div></div><div style={{marginTop:60,paddingTop:18,borderTop:`1.5px dashed ${C3.pencil}60`,fontFamily:'"Caveat",cursive',fontSize:20,color:C3.pencil,display:'flex',justifyContent:'space-between'}}><span>— end of notebook —</span><span style={{color:C3.red}}>thanks for reading ✱</span></div></PR3></SP3>);

<!-- HIREN -->
<script type="text/babel">
const {Underline:UH,ArrowWavy:AWH,Tape:TH,Margin:MGH,COL:CH}=window.Scribbles;
const NotebookHiren=({open,onClose,onJump})=>{
  const[query,setQuery]=React.useState('');
  const[messages,setMessages]=React.useState([{role:'hiren',text:"Hey — I'm HIREN. I'm Vipul's notebook-shaped AI. Ask me anything about him, or pick a shortcut below."}]);
  const[busy,setBusy]=React.useState(false);
  const inputRef=React.useRef(null);
  const scrollRef=React.useRef(null);
  React.useEffect(()=>{if(open)setTimeout(()=>inputRef.current?.focus(),250);},[open]);
  React.useEffect(()=>{if(scrollRef.current)scrollRef.current.scrollTop=scrollRef.current.scrollHeight;},[messages,busy]);
  const ask=async(q)=>{
    if(!q.trim()||busy)return;
    setMessages(m=>[...m,{role:'user',text:q}]);setQuery('');setBusy(true);
    try{const ctx=`You are HIREN, Vipul Yadav's portfolio AI assistant — handwriting style, conversational, wry. Answer in 2-3 short sentences. Vipul: Full-Stack+AI engineer (MERN+PyTorch), B.Tech CSE BTKIT '27, SE Intern at ColoredCow. Open Summer 2026. Stack: React,Next.js,Node,Python,PyTorch,BERT. Projects: COPREPER(AI interviews,50+users),Nishaan(Solidity+IPFS),BERT Emotion(F1 0.89),Resume Matcher(90%+).`;
    const text=await window.claude.complete({messages:[{role:'user',content:ctx+'\n\nQuestion: '+q}]});
    setMessages(m=>[...m,{role:'hiren',text:text.trim()}]);}
    catch{setMessages(m=>[...m,{role:'hiren',text:"Lost the connection — short answer: full-stack+AI engineer, open Summer '26."}]);}
    setBusy(false);
  };
  if(!open)return null;
  return(<div onClick={onClose} style={{position:'fixed',inset:0,zIndex:1000,background:'rgba(40,30,15,.4)',display:'flex',alignItems:'center',justifyContent:'center',animation:'nb-fade .25s'}}><div onClick={e=>e.stopPropagation()} style={{position:'relative',width:580,maxHeight:'82vh',background:'#fdfcf6',backgroundImage:`repeating-linear-gradient(0deg,transparent 0,transparent 27px,${CH.pencil}25 27px,${CH.pencil}25 28px)`,boxShadow:'0 30px 80px rgba(40,30,15,.5),0 0 0 1px rgba(0,0,0,.05)',padding:'28px 32px 24px',transform:'rotate(-1deg)',animation:'nb-drop .35s cubic-bezier(.2,.9,.3,1.2)',display:'flex',flexDirection:'column'}}><div style={{position:'absolute',top:-18,left:'50%',transform:'translateX(-50%) rotate(-4deg)'}}><TH w={160} color="#f7d36b" angle={0}/></div><button onClick={onClose} style={{position:'absolute',top:14,right:18,background:'transparent',border:'none',cursor:'pointer',fontFamily:'"Caveat",cursive',fontSize:24,color:CH.pencil}}>✕ close</button><div style={{display:'flex',alignItems:'baseline',gap:14,marginBottom:4}}><h2 style={{fontFamily:'"Caveat",cursive',fontSize:52,color:CH.ink,margin:0,lineHeight:.9}}>HIREN</h2><span style={{fontFamily:'"Patrick Hand",cursive',fontSize:18,color:CH.pencil}}>(vipul, but a bot)</span></div><UH w={170} color={CH.red} thick={3}/><div ref={scrollRef} style={{flex:1,overflowY:'auto',minHeight:80,maxHeight:280,marginTop:18,paddingRight:6}}>{messages.map((m,i)=>(<div key={i} style={{marginBottom:16}}><div style={{fontFamily:'"Caveat",cursive',fontSize:20,color:m.role==='user'?CH.blue:CH.red,marginBottom:2}}>{m.role==='user'?'you →':'hiren ←'}</div><div style={{fontFamily:m.role==='user'?'"Caveat",cursive':'"Patrick Hand",cursive',fontSize:m.role==='user'?22:19,color:CH.ink,lineHeight:1.45,paddingLeft:6}}>{m.text}</div></div>))}{busy&&(<div style={{fontFamily:'"Caveat",cursive',fontSize:20,color:CH.pencil,paddingLeft:6}}>✎ thinking<span className="nb-dots">...</span></div>)}</div>{messages.length<3&&!busy&&(<div style={{display:'flex',flexWrap:'wrap',gap:8,margin:'14px 0 16px',paddingTop:12,borderTop:`1.5px dashed ${CH.pencil}80`}}>{window.ndata.hirenSuggestions.map((s,i)=>(<button key={i} onClick={()=>s.target?(onJump(s.target),onClose()):ask(s.label)} style={{background:'#fff48a',color:CH.ink,border:`1.5px solid ${CH.ink}40`,padding:'4px 10px',fontFamily:'"Patrick Hand",cursive',fontSize:16,cursor:'pointer',transform:`rotate(${(i%3-1)*1.5}deg)`,boxShadow:'1.5px 1.5px 0 rgba(0,0,0,.08)'}}>{s.target?'→ ':'? '}{s.label}</button>))}</div>)}<div style={{display:'flex',alignItems:'center',gap:10,paddingTop:14,borderTop:`1.5px solid ${CH.ink}30`}}><span style={{fontFamily:'"Caveat",cursive',fontSize:28,color:CH.red}}>✎</span><input ref={inputRef} value={query} onChange={e=>setQuery(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')ask(query);else if(e.key==='Escape')onClose();}} placeholder="write your question…" style={{flex:1,background:'transparent',border:'none',fontFamily:'"Caveat",cursive',fontSize:26,color:CH.ink,outline:'none',borderBottom:`1.5px solid ${CH.pencil}80`,paddingBottom:4}}/><button onClick={()=>ask(query)} disabled={!query.trim()||busy} style={{background:CH.red,color:'#fff',border:'none',fontFamily:'"Caveat",cursive',fontSize:22,padding:'4px 14px',cursor:query.trim()&&!busy?'pointer':'not-allowed',opacity:query.trim()&&!busy?1:.4}}>send →</button></div><div style={{marginTop:10,fontFamily:'"Patrick Hand",cursive',fontSize:13,color:CH.pencil,display:'flex',justifyContent:'space-between'}}><span>↵ to send · ESC to close</span><span>powered by claude</span></div></div></div>);
};
window.NotebookHiren=NotebookHiren;
</script>

<!-- App -->
<script type="text/babel">
const{HeroPage,AboutPage,ExperiencePage}=window.NPages1;
const{ProjectsPage,SkillsPage,CertsPage}=window.NPages2;
const{BlogPage,ContactPage}=window.NPages3;
const{COL:CA}=window.Scribbles;
const SECTIONS=[{key:'about',label:'about',anchor:'p-about'},{key:'experience',label:'experience',anchor:'p-experience'},{key:'projects',label:'projects',anchor:'p-projects'},{key:'skills',label:'stack',anchor:'p-skills'},{key:'certs',label:'receipts',anchor:'p-certs'},{key:'blog',label:'notes',anchor:'p-blog'},{key:'contact',label:'say hi',anchor:'p-contact'}];
const NotebookApp=()=>{
  const[hirenOpen,setHirenOpen]=React.useState(false);
  const[focusedProject,setFocusedProject]=React.useState(null);
  const[activeSection,setActiveSection]=React.useState('hero');
  const scrollTo=(key)=>{const s=SECTIONS.find(x=>x.key===key);if(!s)return;const el=document.getElementById(s.anchor);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});};
  React.useEffect(()=>{const onKey=(e)=>{if(document.activeElement&&['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();setHirenOpen(true);}else if(e.key==='/'||e.key==='?'){e.preventDefault();setHirenOpen(true);}else if(e.key==='Escape')setHirenOpen(false);};window.addEventListener('keydown',onKey);return()=>window.removeEventListener('keydown',onKey);},[]);
  React.useEffect(()=>{const obs=new IntersectionObserver((entries)=>{entries.forEach(en=>{if(en.isIntersecting){const k=en.target.id.replace('p-','');setActiveSection(k);}});},{rootMargin:'-30% 0px -60% 0px'});SECTIONS.forEach(s=>{const el=document.getElementById(s.anchor);if(el)obs.observe(el);});return()=>obs.disconnect();},[]);
  return(<div className="nb-root"><div className="nb-topbar"><div className="nb-topbar-inner"><span style={{fontFamily:'"Caveat",cursive',fontSize:26,color:CA.ink}}>v.ydv's notebook<span style={{color:CA.red}}>.</span></span><nav style={{display:'flex',gap:18}}>{SECTIONS.slice(0,5).map(s=>(<button key={s.key} onClick={()=>scrollTo(s.key)} className={`nb-tab ${activeSection===s.key?'is-active':''}`}>{s.label}</button>))}</nav><button onClick={()=>setHirenOpen(true)} className="nb-btn nb-btn-small">✎ ask HIREN<span style={{marginLeft:8,padding:'0 5px',border:`1.5px solid ${CA.ink}50`,fontSize:12,fontFamily:'"Special Elite",monospace'}}>⌘K</span></button></div></div><main className="nb-main"><div id="p-hero"><HeroPage onHiren={()=>setHirenOpen(true)} onJump={scrollTo}/></div><div id="p-about"><AboutPage/></div><div id="p-experience"><ExperiencePage/></div><div id="p-projects"><ProjectsPage focus={focusedProject} setFocus={setFocusedProject}/></div><div id="p-skills"><SkillsPage/></div><div id="p-certs"><CertsPage/></div><div id="p-blog"><BlogPage/></div><div id="p-contact"><ContactPage onHiren={()=>setHirenOpen(true)}/></div></main><button onClick={()=>setHirenOpen(true)} className="nb-fab" aria-label="Ask HIREN"><span style={{fontFamily:'"Caveat",cursive',fontSize:22,color:CA.ink,lineHeight:1}}>got a Q?</span><span style={{fontFamily:'"Patrick Hand",cursive',fontSize:14,color:CA.red,marginTop:2}}>ask HIREN ✎</span></button><window.NotebookHiren open={hirenOpen} onClose={()=>setHirenOpen(false)} onJump={scrollTo}/></div>);
};
ReactDOM.createRoot(document.getElementById('root')).render(<NotebookApp/>);
</script>
</body>
