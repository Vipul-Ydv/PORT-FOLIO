<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" stroke="#2c3e50" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
  <!-- Rough Paper Background Circle (Optional, prevents transparent gaps) -->
  <circle cx="50" cy="50" r="45" fill="#ffffff" stroke="none"/>
  
  <!-- Head Box (Shaky lines) -->
  <path d="M25,35 Q35,33 50,34 Q65,33 75,35 Q77,55 76,75 Q65,77 50,76 Q35,77 24,75 Q23,55 25,35 Z" fill="#ffffff"/>
  
  <!-- Eyes (Doodle dots) -->
