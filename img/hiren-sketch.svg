  <circle cx="60" cy="50" r="4" fill="#2c3e50" stroke="none"/>
  
  <!-- Mouth (Happy squiggle) -->
  <path d="M40,65 Q50,70 60,63" />
  
  <!-- Antenna -->
  <path d="M50,34 L52,20" />
  <circle cx="52" cy="15" r="6" fill="white" />
  
  <!-- Sparkles/Radio Waves -->
