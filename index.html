<style>
  :root {
    --paper: #f5efd9;
    --ink: #1a1f2e;
    --red: #c83030;
    --blue: #2a4a8a;
    --pencil: #5a6070;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Patrick Hand", "Caveat", sans-serif;
    color: var(--ink);
    background: #fdfcf6;
  }

  .nb-topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    background: rgba(253, 252, 246, 0.88);
    backdrop-filter: blur(8px);
    border-bottom: 1.5px dashed rgba(26, 31, 46, 0.25);
    padding: 10px 0;
  }
  .nb-topbar-inner {
    max-width: none; margin: 0; padding: 0 32px;
    display: flex; align-items: center; gap: 24px;
  }
  .nb-tab {
    background: transparent; border: none; cursor: pointer;
    font-family: "Patrick Hand", cursive; font-size: 17px;
    color: var(--pencil); padding: 4px 6px; position: relative;
    transition: color .15s; white-space: nowrap;
  }
  .nb-tab:hover { color: var(--ink); }
  .nb-tab.is-active { color: var(--red); }
  .nb-tab.is-active::after {
    content: ''; position: absolute; left: 4px; right: 4px; bottom: -2px;
    height: 4px; background: #fff48a; z-index: -1;
  }

  .nb-main {
    margin: 0; padding: 60px 0 0;
    display: flex; flex-direction: column; gap: 0;
    position: relative; z-index: 1;
  }
  .nb-spread { scroll-margin-top: 60px; }

  .nb-btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: #fff; color: var(--ink);
    border: 2px solid var(--ink);
    font-family: "Caveat", cursive; font-size: 22px;
    padding: 6px 16px; cursor: pointer;
    box-shadow: 3px 3px 0 var(--ink);
    transition: transform .1s, box-shadow .1s;
    text-decoration: none;
  }
  .nb-btn:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
  .nb-btn:active { transform: translate(1px, 1px); box-shadow: 2px 2px 0 var(--ink); }
  .nb-btn-primary { background: var(--red); color: #fff; }
  .nb-btn-small { font-size: 18px; padding: 4px 12px; box-shadow: 2px 2px 0 var(--ink); }

  .nb-chip {
    display: inline-flex; align-items: center; gap: 4px;
    font-family: "Patrick Hand", cursive; font-size: 14px;
    color: var(--ink); text-decoration: none;
    background: #fff; border: 1.5px solid var(--ink);
    padding: 1px 8px; line-height: 1.3;
    box-shadow: 1.5px 1.5px 0 var(--ink);
    transition: transform .1s, box-shadow .1s;
  }
  .nb-chip:hover { transform: translate(-1px, -1px); box-shadow: 2.5px 2.5px 0 var(--ink); }
  .nb-chip:active { transform: translate(1px, 1px); box-shadow: 0 0 0 var(--ink); }
  .nb-chip-red { background: var(--red); color: #fff; }
  .nb-chip-tiny { font-size: 13px; padding: 0 7px; }

  .nb-fab {
    position: fixed; right: 24px; bottom: 24px; z-index: 90;
    width: 90px; height: 90px;
    background: #fff48a; border: none; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transform: rotate(-6deg);
    box-shadow: 3px 4px 0 rgba(0,0,0,0.08), 0 8px 16px rgba(0,0,0,0.1);
    transition: transform .15s;
  }
  .nb-fab:hover { transform: rotate(-3deg) scale(1.05); }
  .nb-fab::before {
    content: ''; position: absolute; top: -10px; left: 50%; transform: translateX(-50%) rotate(-4deg);
    width: 50px; height: 14px; background: rgba(244, 195, 60, 0.7);
  }

  @keyframes nb-fade { from { opacity: 0 } to { opacity: 1 } }
  @keyframes nb-drop {
    from { opacity: 0; transform: rotate(-3deg) translateY(-30px) scale(0.95); }
    to   { opacity: 1; transform: rotate(-1deg) translateY(0) scale(1); }
  }
  .nb-dots::after { content: ''; animation: nb-blink 1.2s steps(3) infinite; }
  @keyframes nb-blink { 0% { content: '' } 33% { content: '.' } 66% { content: '..' } 100% { content: '...' } }

  img, svg { max-width: 100%; }

  /* ── Motion ─────────────────────────────────────────────────────────
     Anything with .nb-a gets a data-in attribute the first time it scrolls
     into view (see app.jsx); these rules animate from that. --d delays a
     single element. Everything is switched off for prefers-reduced-motion
     at the bottom of this block. */

  /* Ink: scribble paths draw themselves on. pathLength="1" on each path
     makes the dash maths the same for every length. */
  .nb-ink { stroke-dasharray: 1 2; stroke-dashoffset: 1; }
  [data-in] .nb-ink { animation: nb-draw .9s cubic-bezier(.6,.1,.3,1) var(--d, .15s) forwards; }
  @keyframes nb-draw { to { stroke-dashoffset: 0; } }

  /* Highlighter and strike-through: a background that sweeps left to right,
     one sweep per line when the text wraps. */
  .nb-mark, .nb-strike {
    background-repeat: no-repeat;
    -webkit-box-decoration-break: clone; box-decoration-break: clone;
    transition: background-size .8s cubic-bezier(.6,.1,.3,1) var(--d, .25s);
  }
  .nb-mark {
    background-image: linear-gradient(var(--mk), var(--mk));
    background-size: 0% 42%; background-position: 0 86%;
  }
  .nb-mark[data-in] { background-size: 100% 42%; }
  .nb-strike {
    background-image: linear-gradient(var(--red), var(--red));
    background-size: 0% 2.4px; background-position: 0 58%;
  }
  .nb-strike[data-in] { background-size: 100% 2.4px; }

  /* Photos, polaroids and taped cards fall onto the page and settle. This
     uses the separate translate/rotate/scale properties, which stack on top
     of each element's own inline transform: rotate(...) instead of
     replacing it. */
  .nb-drop:not([data-in]) { opacity: 0; }
  .nb-drop[data-in] { animation: nb-settle .75s cubic-bezier(.2,.8,.3,1.1) var(--d, 0s) backwards; }
  @keyframes nb-settle {
    0%   { opacity: 0; translate: 0 -28px; rotate: 5deg; scale: 1.04; }
    60%  { opacity: 1; translate: 0 2px;   rotate: -1.2deg; scale: 1; }
    100% { translate: 0 0; rotate: 0deg; }
  }
  /* Polaroids lift and straighten under the cursor (--r is their tilt). */
  .nb-lift { transition: translate .2s, rotate .2s; }
  .nb-lift:hover { translate: 0 -6px; rotate: calc(var(--r, 0deg) * -1); }

  /* Reading progress bars fill up to their --w. */
  .nb-fill { width: 0; transition: width 1.4s cubic-bezier(.2,.8,.3,1) var(--d, .3s); }
  [data-in] > .nb-fill { width: var(--w); }

  /* Timeline dots pop in with a little overshoot. */
  .nb-pop:not([data-in]) { scale: 0; }
  .nb-pop[data-in] { animation: nb-pop .5s cubic-bezier(.3,1.6,.5,1) var(--d, .35s) backwards; }
  @keyframes nb-pop { from { scale: 0; } }

  /* Page turn: when a chapter scrolls in, its left page swings down flat
     from the spine like a page being turned. Two-page layout only — below
     900px the pages stack and there is no spine to turn around. */
  @media (min-width: 901px) and (prefers-reduced-motion: no-preference) {
    .nb-spread { perspective: 2400px; }
    .nb-turn:not([data-in]) { opacity: 0; }
    .nb-turn[data-in] {
      transform-origin: right center;
      animation: nb-turn .9s cubic-bezier(.25,.7,.3,1) backwards;
    }
    @keyframes nb-turn {
      from { opacity: 0; transform: rotateY(70deg); }
      45%  { opacity: 1; }
      to   { transform: none; }
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .nb-pop:not([data-in]) { scale: 1; }
    .nb-pop[data-in] { animation: none; }
    .nb-fill { transition: none; width: var(--w); }
    .nb-drop:not([data-in]) { opacity: 1; }
    .nb-drop[data-in] { animation: none; }
    .nb-lift, .nb-lift:hover { transition: none; translate: none; rotate: none; }
    .nb-ink { stroke-dasharray: none; stroke-dashoffset: 0; animation: none !important; }
    .nb-mark, .nb-strike { transition: none; }
    .nb-mark { background-size: 100% 42%; }
    .nb-strike { background-size: 100% 2.4px; }
  }

  /* Visible focus for keyboard users only (mouse clicks don't show it). */
  a:focus-visible, button:focus-visible, input:focus-visible, [role="button"]:focus-visible {
    outline: 2px dashed var(--red); outline-offset: 3px;
  }

  /* ── Responsive ─────────────────────────────────────────────────────
     The spreads are laid out with inline styles, so these overrides need
     !important to win. Below 900px the two-page spread becomes a single
     column: on a phone the right-hand page (contents, blog, contact card)
     was rendered entirely off-screen. */
  .nb-topbar-inner { flex-wrap: wrap; row-gap: 8px; }
  .nb-topbar-actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
  @media (max-width: 900px) { .nb-topbar-actions { margin-left: auto; } .nb-kbd { display: none; } }
  @media (max-width: 480px) { .nb-topbar-brand-by { display: none; } }
  @media (min-width: 901px) {
    .nb-topbar-inner { flex-wrap: nowrap; }
    .nb-topbar-nav { min-width: 0; overflow-x: auto; scrollbar-width: none; }
    .nb-topbar-nav::-webkit-scrollbar { display: none; }
  }
  @media (max-width: 1150px) { .nb-kbd { display: none; } }

  @media (max-width: 900px) {
    .nb-topbar-inner { padding: 0 16px; gap: 12px; }
    .nb-topbar-nav {
      order: 3; width: 100%; flex: 1 0 100% !important;
      justify-content: flex-start !important;
      overflow-x: auto; -webkit-overflow-scrolling: touch;
      padding-bottom: 2px; gap: 10px !important;
    }
    .nb-topbar-nav::-webkit-scrollbar { display: none; }
    .nb-main { padding-top: 96px !important; }
    .nb-spread { scroll-margin-top: 96px; }

    .nb-spread {
      grid-template-columns: 1fr !important;
      min-height: 0 !important;
    }
    .nb-spine { display: none !important; }
    .nb-page-l, .nb-page-r {
      padding: 44px 20px 56px !important;
    }
    .nb-page-l > [data-page-num], .nb-page-r > [data-page-num] {
      position: static !important; margin-top: 24px;
    }
    .nb-fab {
      width: 68px !important; height: 68px !important;
      right: 14px !important; bottom: 14px !important;
    }
  }

  @media (max-width: 600px) {
    .nb-page-l, .nb-page-r { padding: 36px 16px 44px !important; }
  }

  ::-webkit-scrollbar { width: 12px; }
  ::-webkit-scrollbar-track { background: var(--paper); }
  ::-webkit-scrollbar-thumb { background: var(--pencil); border: 3px solid var(--paper); border-radius: 6px; }
</style>
