<style>
  :root {
    --paper: #f5efd9;
    --ink: #1a1f2e;
    --red: #c83030;
    --blue: #2a4a8a;
    --pencil: #5a6070;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Patrick Hand", "Caveat", sans-serif;
    color: var(--ink);
    background: #fdfcf6;
  }

  .nb-topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    background: rgba(253, 252, 246, 0.88);
    backdrop-filter: blur(8px);
    border-bottom: 1.5px dashed rgba(26, 31, 46, 0.25);
    padding: 10px 0;
  }
  .nb-topbar-inner {
    max-width: none; margin: 0; padding: 0 32px;
    display: flex; align-items: center; gap: 24px;
  }
  .nb-tab {
    background: transparent; border: none; cursor: pointer;
    font-family: "Patrick Hand", cursive; font-size: 17px;
    color: var(--pencil); padding: 4px 6px; position: relative;
    transition: color .15s; white-space: nowrap;
  }
  .nb-tab:hover { color: var(--ink); }
  .nb-tab.is-active { color: var(--red); }
  .nb-tab.is-active::after {
    content: ''; position: absolute; left: 4px; right: 4px; bottom: -2px;
    height: 4px; background: #fff48a; z-index: -1;
  }

  .nb-main {
    margin: 0; padding: 60px 0 0;
    display: flex; flex-direction: column; gap: 0;
    position: relative; z-index: 1;
  }
  .nb-spread { scroll-margin-top: 60px; }

  .nb-btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: #fff; color: var(--ink);
    border: 2px solid var(--ink);
    font-family: "Caveat", cursive; font-size: 22px;
    padding: 6px 16px; cursor: pointer;
    box-shadow: 3px 3px 0 var(--ink);
    transition: transform .1s, box-shadow .1s;
    text-decoration: none;
  }
  .nb-btn:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
  .nb-btn:active { transform: translate(1px, 1px); box-shadow: 2px 2px 0 var(--ink); }
  .nb-btn-primary { background: var(--red); color: #fff; }
  .nb-btn-small { font-size: 18px; padding: 4px 12px; box-shadow: 2px 2px 0 var(--ink); }

  .nb-fab {
    position: fixed; right: 24px; bottom: 24px; z-index: 90;
    width: 90px; height: 90px;
    background: #fff48a; border: none; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transform: rotate(-6deg);
    box-shadow: 3px 4px 0 rgba(0,0,0,0.08), 0 8px 16px rgba(0,0,0,0.1);
    transition: transform .15s;
  }
  .nb-fab:hover { transform: rotate(-3deg) scale(1.05); }
  .nb-fab::before {
    content: ''; position: absolute; top: -10px; left: 50%; transform: translateX(-50%) rotate(-4deg);
    width: 50px; height: 14px; background: rgba(244, 195, 60, 0.7);
  }

  @keyframes nb-fade { from { opacity: 0 } to { opacity: 1 } }
  @keyframes nb-drop {
    from { opacity: 0; transform: rotate(-3deg) translateY(-30px) scale(0.95); }
    to   { opacity: 1; transform: rotate(-1deg) translateY(0) scale(1); }
  }
  .nb-dots::after { content: ''; animation: nb-blink 1.2s steps(3) infinite; }
  @keyframes nb-blink { 0% { content: '' } 33% { content: '.' } 66% { content: '..' } 100% { content: '...' } }

  ::-webkit-scrollbar { width: 12px; }
  ::-webkit-scrollbar-track { background: var(--paper); }
  ::-webkit-scrollbar-thumb { background: var(--pencil); border: 3px solid var(--paper); border-radius: 6px; }
</style>
